  Software: PowerPanel Business Edition; upgradeable firmware
  Dimensions (WxHxD): 432 x 89 x 429 mm (17 x 3.5 x 16.9 in)
  Thermal: 478 BTU/hr online, 207 BTU/hr ECO mode
