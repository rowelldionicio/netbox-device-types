  Noise: 38 to 55 dBA at 1 m (0% to 100% load)
  Warranty: 3-year limited; $400,000 lifetime Connected Equipment Guarantee; extended warranty WEXT5YR-U4A
  Outlet banks: rear panel shows Critical Load and Non-Critical Load outlet groups (4 + 4); verify against the physical unit.

